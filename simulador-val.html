<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 3: Simulador de Riesgo - URN</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f1f5f9; padding: 15px; color: #334155;
        }
        .container {
            max-width: 900px; margin: 0 auto; background-color: #ffffff;
            border-radius: 20px; padding: 20px 25px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06); border: 1px solid #e2e8f0;
        }
        .nav-back { display: inline-block; text-decoration: none; color: #2563eb; font-size: 12px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
        header { margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .tag { font-size: 10px; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.1em; }
        h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-top: 2px; }
        
        .revista-wrapper { background-color: #ffffff; border: 3px solid #cbd5e1; border-radius: 16px; padding: 20px; margin-bottom: 10px; }
        .revista-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 12px; }
        .revista-pills { font-size: 10.5px; font-weight: 800; color: #a855f7; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .proyecto-grid { display: flex; gap: 20px; margin: 10px 0 15px 0; }
        
        /* PANEL DE CONTROLES SLIDERS */
        .columna-controles {
            flex: 0.9; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 16px;
        }
        /* PANEL DE CONSOLA DE RESULTADOS */
        .columna-consola {
            flex: 1.1; background-color: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 16px; color: #38bdf8; font-family: monospace; font-size: 12px; line-height: 1.5; overflow-y: auto; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }
        
        .control-group { margin-bottom: 14px; }
        .control-group label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #475569; margin-bottom: 4px; }
        .control-group input[type="range"] { width: 100%; accent-color: #a855f7; }
        .control-group select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 12px; font-weight: 600; color: #334155; }
        .val-display { font-size: 13px; font-weight: 800; color: #a855f7; float: right; }

        .console-line { margin-bottom: 6px; }
        .console-highlight { color: #f43f5e; font-weight: bold; }
        .console-success { color: #4ade80; font-weight: bold; }
        .console-white { color: #ffffff; }

        .revista-controles { display: flex; justify-content: space-between; margin-top: 15px; gap: 15px; border-top: 2px solid #f1f5f9; padding-top: 12px; }
        .btn-nav { flex: 1; display: block; text-decoration: none; background-color: #64748b; border-bottom: 4px solid #475569; padding: 12px; border-radius: 8px; font-size: 14.5px; font-weight: 800; color: #ffffff !important; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">◀ Regresar al Tablero Principal</a>

        <header>
            <span class="tag">Unidad 03 · Dinámica Práctica</span>
            <h1>Simulador Interactivo de Riesgo Hipotecario</h1>
        </header>

        <div class="revista-wrapper">
            <div class="revista-header">
                <span class="revista-pills">Laboratorio de Valuación Financiera</span>
                <span style="font-size: 10.5px; font-weight: 800; color: #94a3b8;">Algoritmo Ross-Heidecke</span>
            </div>

            <div style="padding: 0 5px;">
                <!-- INTERFAZ DEL SIMULADOR -->
                <div class="proyecto-grid">
                    
                    <!-- PANEL IZQUIERDO: INPUTS DEL ALUMNO -->
                    <div class="columna-controles" style="border-top: 4px solid #a855f7;">
                        <h4 style="font-size: 12px; font-weight: 900; color: #0f172a; text-transform: uppercase; margin-bottom: 12px; border-bottom: 2px solid #cbd5e1; padding-bottom: 4px;">🎛 Variables de la Residencia</h4>
                        
                        <div class="control-group">
                            <label>Precio de Salida (Portal) <span id="lbl-precio" class="val-display">$2.5M</span></label>
                            <input type="range" id="inp-precio" min="1000000" max="10000000" step="500000" value="2500000" oninput="calcularSimulador()">
                        </div>

                        <div class="control-group">
                            <label>Edad Cronológica de la Obra <span id="lbl-edad" class="val-display">25 años</span></label>
                            <input type="range" id="inp-edad" min="0" max="60" step="1" value="25" oninput="calcularSimulador()">
                        </div>

                        <div class="control-group">
                            <label>Estado de Conservación (SHF)</label>
                            <select id="inp-conservacion" onchange="calcularSimulador()">
                                <option value="Excelente">Excelente (Código 1/2)</option>
                                <option value="Bueno">Bueno (Código 3)</option>
                                <option value="Regular" selected>Regular (Código 4)</option>
                                <option value="Malo">Malo (Código 5/6)</option>
                            </select>
                        </div>
                    </div>

                    <!-- PANEL DERECHO: CONSOLA DE RIESGOS EN TIEMPO REAL -->
                    <div class="columna-consola">
                        <div id="consola-salida"><!-- Render dinámico desde JS --></div>
                    </div>

                </div>

                <div class="revista-controles">
                    <a href="valuacion-p3.html" class="btn-nav">◀ Regresar a la Clase (Pág. 3)</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatMXN(val) {
            return '$' + Number(val).toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' MXN';
        }

        function calcularSimulador() {
            // Leer Inputs
            const precioPortal = parseFloat(document.getElementById('inp-precio').value);
            const edadCasa = parseInt(document.getElementById('inp-edad').value);
            const conservacion = document.getElementById('inp-conservacion').value;
            
            const vidaUtilTotal = 60;
            const aforoBase = 0.90;

            // Actualizar etiquetas visuales de los Sliders
            document.getElementById('lbl-precio').innerText = '$' + (precioPortal / 1000000).toFixed(1) + 'M';
            document.getElementById('lbl-edad').innerText = `${edadCasa} años`;

            // ALGORITMO JAVASCRIPT REPLICA DE TU PYTHON
            // Paso 1: Castigo por Negociación
            const pctNegociacion = 0.08;
            const descuentoNegociacion = precioPortal * pctNegociacion;
            const subtotal1 = precioPortal - descuentoNegociacion;

            // Paso 2: Depreciación por Edad y Conservación (Ross-Heidecke)
            const porcentajeVidaTranscurrida = edadCasa / vidaUtilTotal;
            const dictConservacion = { "Excelente": 0.0, "Bueno": 0.05, "Regular": 0.15, "Malo": 0.35 };
            const fConservacion = dictConservacion[conservacion];
            
            let pctDepreciacion = (porcentajeVidaTranscurrida * 0.5) + fConservacion;
            pctDepreciacion = Math.max(0.0, Math.min(0.70, pctDepreciacion));
            
            const descuentoDepreciacion = subtotal1 * pctDepreciacion;
            const subtotal2 = subtotal1 - descuentoDepreciacion;

            // Paso 3: Castigo por Entorno/Forma
            const pctEntorno = 0.035;
            const descuentoEntorno = subtotal2 * pctEntorno;
            const valorComercialX = subtotal2 - descuentoEntorno;

            // Paso 4 y 5: Criterio de Riesgo del Banco y Aforo
            const vidaUtilRemanente = vidaUtilTotal - edadCasa;
            let aforoFinal = aforoBase;
            let motivoAforo = "Propiedad joven / Excelente vida remanente";

            if (vidaUtilRemanente < 20) {
                aforoFinal = 0.70;
                motivoAforo = "Alta edad / Baja vida remanente (<20 años)";
            } else if (vidaUtilRemanente < 35) {
                aforoFinal = 0.80;
                motivoAforo = "Edad media / Vida remanente justa (20-35 años)";
            }

            const montoCredito = valorComercialX * aforoFinal;
            const engancheNecesario = precioPortal - montoCredito;

            // Inyección limpia de los resultados simulando la terminal de Python
            document.getElementById('consola-salida').innerHTML = `
                <div class="console-line console-white">--- SIMULADOR INTERACTIVO DE RIESGO ---</div>
                <div class="console-line">Precio inicial en portales: <span class="console-white">${formatMXN(precioPortal)}</span></div>
                <br>
                <div class="console-line">[Paso 1] Castigo por Negociación (8%): <span class="console-highlight">-${formatMXN(descuentoNegociacion)}</span></div>
                <div class="console-line">&nbsp;&nbsp;&nbsp;&gt; Subtotal 1: ${formatMXN(subtotal1)}</div>
                <br>
                <div class="console-line">[Paso 2] Castigo Físico (Edad + Estado): <span class="console-highlight">-${formatMXN(descuentoDepreciacion)}</span></div>
