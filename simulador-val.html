<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 3: Prueba de Barras - URN</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f1f5f9; 
            padding: 40px 20px;
            color: #334155;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            border: 1px solid #e2e8f0;
        }
        .nav-back {
            display: inline-block;
            text-decoration: none;
            color: #2563eb;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        header {
            margin-bottom: 35px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
        }
        .tag {
            font-size: 11px;
            font-weight: 800;
            color: #a855f7;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            margin-top: 4px;
        }
        .simulador-box {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        .sim-group { display: flex; flex-direction: column; gap: 8px; }
        .sim-label { font-size: 13px; font-weight: 700; color: #475569; }
        .sim-input-row { display: flex; align-items: center; gap: 15px; }
        .sim-range { flex: 1; cursor: pointer; height: 12px; accent-color: #a855f7; }
        .sim-value { font-size: 14px; font-weight: 800; color: #a855f7; min-width: 120px; text-align: right; }
        
        .revista-controles { display: flex; justify-content: space-between; margin-top: 30px; gap: 20px; }
        .btn-nav {
            flex: 1; display: block; text-decoration: none; background-color: #2563eb; border-bottom: 5px solid #1d4ed8; padding: 18px; border-radius: 14px; font-size: 16px; font-weight: 800; color: #ffffff; text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">◀ Regresar al Tablero Principal</a>

        <header>
            <span class="tag">Módulo 03 · Fase de Prueba</span>
            <h1>Paso 1: Validación de Controles Deslizantes</h1>
        </header>

        <div class="simulador-box">
            <p style="font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 10px;">🔧 Verificación de Conectividad de Barras</p>
            
            <div class="sim-group">
                <label class="sim-label">Precio de Salida (Portal):</label>
                <div class="sim-input-row">
                    <input type="range" id="range-precio" class="sim-range" min="1000000" max="10000000" step="500000" value="2500000">
                    <span id="val-precio" class="sim-value">$2,500,000</span>
                </div>
            </div>

            <div class="sim-group">
                <label class="sim-label">Edad Cronológica de la Casa:</label>
                <div class="sim-input-row">
                    <input type="range" id="range-edad" class="sim-range" min="0" max="60" step="1" value="25">
                    <span id="val-edad" class="sim-value">25 Años</span>
                </div>
            </div>
        </div>

        <div class="revista-controles">
            <a href="valuacion-p3.html" class="btn-nav">◀ Regresar a la Clase (Pág. 3)</a>
        </div>
    </div>

    <script>
        // Vincular los elementos exactamente como en tu Módulo 1 exitoso
        var inputPrecio = document.getElementById('range-precio');
        var inputEdad = document.getElementById('range-edad');
        
        var txtPrecio = document.getElementById('val-precio');
        var txtEdad = document.getElementById('val-edad');

        function actualizarTextos() {
            var precio = parseInt(inputPrecio.value);
            var edad = parseInt(inputEdad.value);

            // Cambiar los textos en la pantalla
            txtPrecio.innerText = '$' + precio.toLocaleString('es-MX') + ' MXN';
            txtEdad.innerText = edad + ' Años';
        }

        // Asignar el evento de movimiento
        inputPrecio.oninput = actualizarTextos;
        inputEdad.oninput = actualizarTextos;

        // Ejecutar una vez al cargar para verificar que pinte los valores iniciales
        actualizarTextos();
    </script>
</body>
</html>
