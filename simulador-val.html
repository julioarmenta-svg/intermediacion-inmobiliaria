<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 3: Prueba de Controles y Crédito - URN</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f1f5f9; 
            padding: 40px 20px;
            color: #334155;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            border: 1px solid #e2e8f0;
        }
        .nav-back {
            display: inline-block;
            text-decoration: none;
            color: #2563eb;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        header {
            margin-bottom: 35px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
        }
        .tag {
            font-size: 11px;
            font-weight: 800;
            color: #a855f7;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            margin-top: 4px;
        }
        .simulador-box {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        .sim-group { display: flex; flex-direction: column; gap: 8px; }
        .sim-label { font-size: 13px; font-weight: 700; color: #475569; }
        .sim-input-row { display: flex; align-items: center; gap: 15px; }
        .sim-range { flex: 1; cursor: pointer; height: 12px; accent-color: #a855f7; }
        .sim-value { font-size: 14px; font-weight: 800; color: #a855f7; min-width: 120px; text-align: right; }
        
        .select-container { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #475569; padding: 12px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; }
        .select-container select { flex: 1; padding: 4px; border: none; font-size: 13px; font-weight: 700; color: #334155; outline: none; cursor: pointer; }
        
        /* DESGLOSE DEL PASO A */
        .txt-desglose-paso {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            margin-top: 5px;
        }
        .val-castigo-rojo {
            font-size: 13px;
            font-weight: 800;
            color: #ef4444;
            float: right;
        }

        .resultado-box { padding: 20px; border-radius: 12px; text-align: center; font-weight: 800; font-size: 14px; border: 1px solid transparent; margin-top: 10px; line-height: 1.5; }
        .status-success { background-color: #d1fae5; border-color: #a7f3d0; color: #065f46; }
        .status-alert { background-color: #fee2e2; border-color: #fca5a5; color: #991b1b; }

        .revista-controles { display: flex; justify-content: space-between; margin-top: 30px; gap: 20px; }
        .btn-nav {
            flex: 1; display: block; text-decoration: none; background-color: #2563eb; border-bottom: 4px solid #1d4ed8; padding: 18px; border-radius: 14px; font-size: 16px; font-weight: 800; color: #ffffff; text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">◀ Regresar al Tablero Principal</a>

        <header>
            <span class="tag">Módulo 03 · Herramienta Didáctica</span>
            <h1>Paso 5: Desglose de Castigo Monetario</h1>
        </header>

        <div class="simulador-box">
            <p style="font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 10px;">🔧 Simulación de Impacto Técnico Institucional</p>
            
            <div class="sim-group">
                <label class="sim-label">Precio de Salida (Portal):</label>
                <div class="sim-input-row">
                    <input type="range" id="range-precio" class="sim-range" min="1000000" max="10000000" step="500000" value="2500000">
                    <span id="val-precio" class="sim-value">$2,500,000</span>
                </div>
            </div>

            <div class="sim-group">
                <label class="sim-label">Edad Cronológica de la Casa:</label>
                <div class="sim-input-row">
                    <input type="range" id="range-edad" class="sim-range" min="0" max="60" step="1" value="25">
                    <span id="val-edad" class="sim-value">25 Años</span>
                </div>
            </div>

            <div class="sim-group">
                <label class="sim-label">Estado de Conservación de la Obra (SHF):</label>
                <label class="select-container">
                    <select id="select-conservacion">
                        <option value="Excelente">Excelente / Bueno (Código SHF 1, 2 y 3)</option>
                        <option value="Regular">Regular / Reparaciones Sencillas (Código SHF 4)</option>
                        <option value="Malo">Malo / Requiere Presupuesto de Obra (Código SHF 5)</option>
                        <option value="Rechazo">Daño Estructural / Ruina (Código SHF 6 o superior)</option>
                    </select>
                </label>
            </div>

            <!-- PASO A: DESGLOSE DE PÉRDIDA POR CONSERVACIÓN -->
            <div class="txt-desglose-paso">
                <span>[Paso A] Castigo Estimado por Conservación (SHF):</span>
                <span id="txt-castigo-pesos" class="val-castigo-rojo">$0 MXN</span>
            </div>

            <!-- BLOQUE DE MONTO AUTORIZADO DE CRÉDITO -->
            <div id="status-render" class="resultado-box status-success">MONTO DE CRÉDITO AUTORIZADO: $0</div>
        </div>

        <div class="revista-controles">
            <a href="valuacion-p3.html" class="btn-nav">◀ Regresar a la Clase (Pág. 3)</a>
        </div>
    </div>

    <script>
        var inputPrecio = document.getElementById('range-precio');
        var inputEdad = document.getElementById('range-edad');
        var selectConservacion = document.getElementById('select-conservacion');
        
        var txtPrecio = document.getElementById('val-precio');
        var txtEdad = document.getElementById('val-edad');
        var txtCastigoPesos = document.getElementById('txt-castigo-pesos');
        var statusBox = document.getElementById('status-render');

        function formatMXN(val) {
            return '$' + Math.round(val).toLocaleString('es-MX') + ' MXN';
        }

        function actualizarSimulador() {
            var precio = parseInt(inputPrecio.value);
            var edad = parseInt(inputEdad.value);
            var estado = selectConservacion.value;

            txtPrecio.innerText = formatMXN(precio);
            txtEdad.innerText = edad + ' Años';

            // EVALUACIÓN DE CONSERVACIÓN
            var factorCastigoAvaluo = 1.0;
            var esInaptitud = false;

            if (estado === "Excelente") {
                factorCastigoAvaluo = 1.0;
            } else if (estado === "Regular") {
                factorCastigoAvaluo = 0.95;
            } else if (estado === "Malo") {
                factorCastigoAvaluo = 0.80;
            } else if (estado === "Rechazo") {
                esInaptitud = true;
            }

            // CALCULO SIN CARACTERES ESPECIALES EN LA VARIABLE
            var valorComercialAvaluo = precio * factorCastigoAvaluo;
            var diferenciaDinero = precio - valorComercialAvaluo;

            if (esInaptitud) {
                txtCastigoPesos.innerText = "RECHAZO DE GARANTÍA";
                txtCastigoPesos.style.color = "#ef4444";
            } else if (diferenciaDinero === 0) {
                txtCastigoPesos.innerText = "$0 MXN";
                txtCastigoPesos.style.color = "#64748b";
            } else {
                txtCastigoPesos.innerText = "-" + formatMXN(diferenciaDinero);
                txtCastigoPesos.style.color = "#ef4444";
            }

            // EVALUACIÓN DE RIESGO DE EDAD
            var vidaUtilTotal = 60;
            var vidaUtilRemanente = vidaUtilTotal - edad;
            var aforoFinal = 0.90;
            var motivoAforo = "Garantía Óptima";

            if (vidaUtilRemanente < 20) {
                aforoFinal = 0.70;
                motivoAforo = "Aforo Castigado por Alta Edad (<20 años de vida remanente)";
            } else if (vidaUtilRemanente < 35) {
                aforoFinal = 0.80;
                motivoAforo = "Aforo Ajustado por Edad Media (20-35 años de vida remanente)";
            }

            // DESPLIEGUE FINAL DE LA MESA DE CONTROL
            if (esInaptitud) {
                statusBox.className = "resultado-box status-alert";
                statusBox.innerHTML = "❌ CRÉDITO RECHAZADO: El inmueble Dictamina como NO APTO para Garantía Hipotecaria (Código SHF 6)";
            } else {
                var montoCredito = valorComercialAvaluo * aforoFinal;
                
                if (aforoFinal < 0.90 || factorCastigoAvaluo < 1.0) {
                    statusBox.className = "resultado-box status-alert";
                } else {
                    statusBox.className = "resultado-box status-success";
                }
