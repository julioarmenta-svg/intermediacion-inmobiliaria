<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 4: Simulador de Co-Fondeo - URN</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f1f5f9; padding: 40px 20px; color: #334155;
        }
        .container {
            max-width: 900px; margin: 0 auto; background-color: #ffffff;
            border-radius: 28px; padding: 40px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06); border: 1px solid #e2e8f0;
        }
        .nav-back { display: inline-block; text-decoration: none; color: #2563eb; font-size: 13px; font-weight: 800; margin-bottom: 25px; text-transform: uppercase; }
        header { margin-bottom: 35px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; }
        .tag { font-size: 11px; font-weight: 800; color: #2563eb; text-transform: uppercase; letter-spacing: 0.12em; }
        h1 { font-size: 32px; font-weight: 800; color: #0f172a; margin-top: 4px; }
        .simulador-box { background-color: #f8fafc; border: 2px solid #cbd5e1; border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .sim-group { display: flex; flex-direction: column; gap: 8px; }
        .sim-label { font-size: 13px; font-weight: 700; color: #475569; }
        
        .sim-input-text { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; font-weight: 700; color: #334155; background-color: #ffffff; outline: none; }
        
        .select-container { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #475569; padding: 6px 12px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; }
        .select-container select { flex: 1; padding: 6px; border: none; font-size: 14px; font-weight: 700; color: #334155; outline: none; cursor: pointer; }
        
        .resultado-wrapper { display: flex; flex-direction: column; gap: 10px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 14px; padding: 20px; font-family: monospace; font-size: 13px; }
        .res-line { display: flex; justify-content: space-between; padding: 4px 0; }
        .res-title { font-weight: bold; color: #0f172a; }
        .res-val-info { color: #475569; font-weight: 600; }

        .resultado-box { padding: 20px; border-radius: 12px; text-align: center; font-weight: 800; font-size: 15px; border: 1px solid transparent; margin-top: 10px; line-height: 1.6; }
        .status-success { background-color: #d1fae5; border-color: #a7f3d0; color: #065f46; }
        
        .revista-controles { display: flex; justify-content: space-between; margin-top: 30px; gap: 20px; }
        .btn-nav { flex: 1; display: block; text-decoration: none; background-color: #2563eb; border-bottom: 5px solid #1d4ed8; padding: 18px; border-radius: 14px; font-size: 16px; font-weight: 800; color: #ffffff; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">◀ Regresar al Tablero Principal</a>

        <header>
            <span class="tag">Módulo 04 · Herramienta Didáctica</span>
            <h1>Laboratorio de Arquitectura de Crédito</h1>
        </header>

        <div class="simulador-box">
            <p style="font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 10px;">🔧 SIMULADOR DE CAPACIDAD DE PAGO (PASO 1)</p>
            
            <!-- ENTRADA MANUAL VALOR VIVIENDA -->
            <div class="sim-group">
                <label class="sim-label">Valor de la Vivienda (Entrada Manual):</label>
                <input type="number" id="txt-valor-vivienda" class="sim-input-text" value="3000000">
            </div>

            <!-- SELECCIÓN PLAZO -->
            <div class="sim-group">
                <label class="sim-label">Plazo del Crédito Bancario:</label>
                <label class="select-container">
                    <select id="select-plazo">
                        <option value="5">5 Años (Tasa 8.75%)</option>
                        <option value="10">10 Años (Tasa 9.35%)</option>
                        <option value="15">15 Años (Tasa 9.50%)</option>
                        <option value="20" selected>20 Años (Tasa 9.75%)</option>
                    </select>
                </label>
            </div>

            <!-- DESGLOSE DE CAPITALES BASE -->
            <div class="resultado-wrapper">
                <div class="res-line">
                    <span class="res-title">Crédito Bancario Autorizado (90% Base):</span>
                    <span id="lbl-res-banco" class="res-val-info">$0</span>
                </div>
                <div class="res-line">
                    <span class="res-title">Tasa de Interés Anual Aplicada:</span>
                    <span id="lbl-res-tasa" class="res-val-info">0.00%</span>
                </div>
            </div>

            <!-- CUADRO DE ESTADO TEMPORAL -->
            <div id="status-render" class="resultado-box status-success">CONEXIÓN DE DATOS ACTIVA</div>
        </div>

        <div class="revista-controles">
            <a href="credito-p2.html" class="btn-nav">◀ Regresar a la Clase (Pág. 2)</a>
        </div>
    </div>

    <script>
        // Vincular los únicos elementos activos de este primer paso
        var inputVivienda = document.getElementById('txt-valor-vivienda');
        var selectPlazo = document.getElementById('select-plazo');
        
        var lblBanco = document.getElementById('lbl-res-banco');
        var lblTasa = document.getElementById('lbl-res-tasa');

        function realizarCalculoBase() {
            var valorVivienda = parseFloat(inputVivienda.value) || 0;
            var plazoAnios = parseInt(selectPlazo.value);

            // 1. Calcular el 90% de crédito bancario de forma directa
            var montoCreditoBanco = valorVivienda * 0.90;

            // 2. Determinar la tasa correspondiente según el plazo
            var tasaAnual = 9.75;
            if (plazoAnios === 5) tasaAnual = 8.75;
            else if (plazoAnios === 10) tasaAnual = 9.35;
            else if (plazoAnios === 15) tasaAnual = 9.50;

            // 3. Pintar los resultados nativos en la tabla sin regionalismos
            lblBanco.innerText = '$' + Math.round(montoCreditoBanco).toLocaleString() + ' MXN';
            lblTasa.innerText = tasaAnual.toFixed(2) + '%';
        }

        // Asignar eventos de escucha individuales
        inputVivienda.oninput = realizarCalculoBase;
        selectPlazo.onchange = realizarCalculoBase;

        // Arrancar al cargar el archivo
        realizarCalculoBase();
    </script>
</body>
</html>
