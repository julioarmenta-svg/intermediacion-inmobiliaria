<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 1: Simulador de Perfilamiento - URN</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f5f9; padding: 40px 20px; color: #334155; }
        .container { max-width: 700px; margin: 0 auto; background-color: #ffffff; border-radius: 28px; padding: 40px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06); border: 1px solid #e2e8f0; }
        header { margin-bottom: 35px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; }
        .tag { font-size: 11px; font-weight: 800; color: #10b981; text-transform: uppercase; letter-spacing: 0.12em; }
        h1 { font-size: 28px; font-weight: 800; color: #0f172a; margin-top: 4px; letter-spacing: -0.02em; }
        .simulador-box { background-color: #f8fafc; border: 2px solid #cbd5e1; border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .sim-group { display: flex; flex-direction: column; gap: 8px; }
        .sim-label { font-size: 13px; font-weight: 700; color: #475569; }
        .sim-input-row { display: flex; align-items: center; gap: 15px; }
        .sim-range { flex: 1; cursor: pointer; height: 12px; accent-color: #2563eb; }
        .sim-value { font-size: 14px; font-weight: 800; color: #2563eb; min-width: 110px; text-align: right; }
        .checkbox-container { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #475569; cursor: pointer; padding: 12px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; }
        .checkbox-container input { width: 18px; height: 16px; cursor: pointer; }
        .resultado-box { padding: 20px; border-radius: 12px; text-align: center; font-weight: 800; font-size: 14px; border: 1px solid transparent; }
        .status-success { background-color: #d1fae5; border-color: #a7f3d0; color: #065f46; }
        .status-alert { background-color: #fee2e2; border-color: #fca5a5; color: #991b1b; }
        .revista-controles { display: flex; justify-content: space-between; gap: 20px; }
        .btn-nav { flex: 1; display: block; text-decoration: none; background-color: #2563eb; border-bottom: 5px solid #1d4ed8; padding: 18px; border-radius: 14px; font-size: 16px; font-weight: 800; color: #ffffff; text-align: center; }
        .btn-nav:hover { background-color: #3b82f6; }
        .btn-nav:active { transform: translateY(3px); border-bottom: 2px solid #1d4ed8; }
        .nav-back { display: inline-block; text-decoration: none; color: #2563eb; font-size: 13px; font-weight: 800; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 0.05em; }
        .nav-back:hover { color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">◀ Regresar al Tablero Principal</a>

        <header>
            <span class="tag">Módulo 01 · Herramienta Didáctica</span>
            <h1>Introducción a la Intermediación Inmobiliaria</h1>
        </header>

        <!-- PANEL DE CONTROL DE LA CALCULADORA -->
        <div class="simulador-box">
            <p style="font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 10px;">🔧 SIMULADOR DE PRE-CALIFICACIÓN DE LEADS</p>
            
            <div class="sim-group">
                <label class="sim-label">Ingreso Familiar Mensual:</label>
                <div class="sim-input-row">
                    <input type="range" id="range-ingresos" class="sim-range" min="20000" max="150000" step="5000" value="45000">
                    <span id="val-ingresos" class="sim-value">$45,000 MXN</span>
                </div>
            </div>

            <div class="sim-group">
                <label class="sim-label">Tiempo de Traslado Máximo (Trabajo):</label>
                <div class="sim-input-row">
                    <input type="range" id="range-trafico" class="sim-range" min="15" max="120" step="5" value="45">
                    <span id="val-trafico" class="sim-value">45 Mins</span>
                </div>
            </div>

            <div class="sim-group" style="gap: 10px;">
                <label class="sim-label">Variables de Entorno Indispensables:</label>
                <label class="checkbox-container">
                    <input type="checkbox" id="check-escuela" checked>
                    <span>Infraestructura Escolar / Guarderías Cercanas</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="check-buro" checked>
                    <span>Buró de Crédito Sano (Sin Claves de Alerta)</span>
                </label>
            </div>

            <div id="status-render" class="resultado-box status-success">✅ PROSPECTO COMPATIBLE (Lead Calificado)</div>
        </div>

        <!-- CONTROLES OBLIGATORIOS -->
        <div class="revista-controles">
            <a href="prospeccion-p3.html" class="btn-nav">◀ Anterior</a>
            <a href="prospeccion-p5.html" class="btn-nav">Siguiente ▶</a>
        </div>
    </div>

    <script>
        var inputIngresos = document.getElementById('range-ingresos');
        var inputTrafico = document.getElementById('range-trafico');
        var checkEscuela = document.getElementById('check-escuela');
        var checkBuro = document.getElementById('check-buro');
        var txtIngresos = document.getElementById('val-ingresos');
        var txtTrafico = document.getElementById('val-trafico');
        var statusBox = document.getElementById('status-render');

        function actualizarEvaluacion() {
            var ingresos = parseInt(inputIngresos.value);
            var trafico = parseInt(inputTrafico.value);
            var tieneEscuela = checkEscuela.checked;
            var buroSano = checkBuro.checked;

            txtIngresos.innerText = '$' + ingresos.toLocaleString() + ' MXN';
            txtTrafico.innerText = trafico + ' Mins';

            if (ingresos < 35000) {
                statusBox.className = "resultado-box status-alert";
                statusBox.innerText = "❌ DESCARTADO: Ingresos menores a $35,000 MXN";
            } else if (trafico > 75) {
                statusBox.className = "resultado-box status-alert";
                statusBox.innerText = "❌ RIESGO LOGÍSTICO: Tráfico mayor a 75 Minutos";
            } else if (!buroSano) {
                statusBox.className = "resultado-box status-alert";
                statusBox.innerText = "❌ RECHAZO FINANCIERO: Bloqueo por historial crediticio";
            } else if (!tieneEscuela) {
                statusBox.className = "resultado-box status-alert";
                statusBox.innerText = "⚠️ REVISAR CON EL CLIENTE: Falta de infraestructura familiar";
            } else {
                statusBox.className = "resultado-box status-success";
                statusBox.innerText = "✅ PROSPECTO COMPATIBLE (Lead Calificado)";
            }
        }

        inputIngresos.oninput = actualizarEvaluacion;
        inputTrafico.oninput = actualizarEvaluacion;
        checkEscuela.onchange = actualizarEvaluacion;
        checkBuro.onchange = actualizarEvaluacion;
    </script>
</body>
</html>
